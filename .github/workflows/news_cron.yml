name: Auto Fetch News 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *' # Har 4 ghante mein chalega

permissions:
  contents: write   # GITHUB_TOKEN ko push karne ki permission (isà¤•à¥‡ bina push chupke se fail hota hai)

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news fetcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          python fetcher.py

      - name: Commit and push updated database + json
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/articles.json tejaltechwire.db articles/ sitemap.xml robots.txt *.txt index.html
          git commit -m "Auto-update latest news" || exit 0
          git pull --rebase
          git push
          
