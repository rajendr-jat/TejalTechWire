<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TejalTechWire | Editorial</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: #fff; color: #1a1a1a; }
        .container { max-width: 650px; margin: 0 auto; padding: 20px 20px 80px 20px; }
        
        /* Home View */
        .hero { margin-bottom: 40px; cursor: pointer; }
        .hero-img { width: 100%; height: 320px; object-fit: cover; border-radius: 4px; }
        .hero-title { font-family: Georgia, serif; font-size: 2.2rem; margin: 20px 0 10px; line-height: 1.2; }
        .author { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: #666; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; background: #ddd; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #555; }

        .feed-item { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; cursor: pointer; }
        .feed-img { width: 90px; height: 90px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
        .feed-text h4 { margin: 0 0 6px; font-size: 1.15rem; line-height: 1.35; font-family: Georgia, serif; }
        .feed-text span { font-size: 0.85rem; color: #757575; }

        /* Reader View */
        #reader-view { display: none; }
        .back-btn { background: none; border: none; font-size: 1rem; color: #1a73e8; cursor: pointer; margin-bottom: 20px; padding: 0; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }
        .reader-title { font-family: Georgia, serif; font-size: 2.5rem; line-height: 1.2; margin-bottom: 20px; }
        .reader-img { width: 100%; height: 400px; object-fit: cover; border-radius: 4px; margin-bottom: 30px; }
        .reader-content { font-family: Georgia, serif; font-size: 1.15rem; line-height: 1.8; color: #292929; }
        .reader-content p { margin-bottom: 1.5rem; }
        .reader-content h3 { font-family: -apple-system, sans-serif; font-size: 1.4rem; margin-top: 2rem; margin-bottom: 1rem; color: #1a1a1a; }

        /* Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-around; padding: 12px 0; background: white; border-top: 1px solid #eee; z-index: 1000; }
        .bottom-nav span { cursor: pointer; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="container">
        <!-- HOME VIEW (Feed + Hero) -->
        <div id="home-view">
            <div class="hero" id="hero-section"></div>
            <div style="font-size: 0.9rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: #757575; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 8px;">More Stories</div>
            <div id="feed-list"></div>
        </div>

        <!-- READER VIEW (Full Article) -->
        <div id="reader-view">
            <button class="back-btn" onclick="goBack()">← Back to Feed</button>
            <div class="author" id="reader-author" style="margin-bottom: 15px;"></div>
            <h1 class="reader-title" id="reader-title"></h1>
            <img id="reader-img" class="reader-img">
            <div class="reader-content" id="reader-body"></div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <span onclick="goBack()">🏠</span>
        <span>🔖</span>
        <span>✍️</span>
        <span>🔔</span>
        <span>👤</span>
    </nav>

    <script>
        let allArticles = [];

        async function loadData() {
            try {
                const res = await fetch('data/articles.json');
                allArticles = await res.json();
                
                if(allArticles.length === 0) return;

                // Hero section (First Article)
                const hero = allArticles[0];
                document.getElementById('hero-section').innerHTML = `
                    <img src="${hero.image_url || 'https://images.unsplash.com/photo-1518770660439-4636190af475?w=800'}" class="hero-img">
                    <h1 class="hero-title">${hero.title}</h1>
                    <div class="author">
                        <div class="avatar">${hero.source_name ? hero.source_name[0] : 'T'}</div>
                        <span>${hero.source_name} • 5h ago</span>
                    </div>
                `;
                document.getElementById('hero-section').onclick = () => openArticle(0);

                // List section (Remaining)
                const list = document.getElementById('feed-list');
                list.innerHTML = '';
                allArticles.slice(1).forEach((item, index) => {
                    const actualIndex = index + 1;
                    list.innerHTML += `
                        <div class="feed-item" onclick="openArticle(${actualIndex})">
                            <div class="feed-text">
                                <h4>${item.title}</h4>
                                <span>${item.source_name} • 3h ago</span>
                            </div>
                            <img src="${item.image_url || 'https://images.unsplash.com/photo-1518770660439-4636190af475?w=800'}" class="feed-img">
                        </div>
                    `;
                });
            } catch (err) {
                console.log("Loading error");
            }
        }

        function openArticle(index) {
            const article = allArticles[index];
            
            document.getElementById('reader-title').innerText = article.title;
            document.getElementById('reader-img').src = article.image_url || 'https://images.unsplash.com/photo-1518770660439-4636190af475?w=800';
            document.getElementById('reader-body').innerHTML = article.summary;
            document.getElementById('reader-author').innerHTML = `
                <div class="avatar">${article.source_name ? article.source_name[0] : 'T'}</div>
                <span>Published by <b>${article.source_name}</b></span>
            `;

            document.getElementById('home-view').style.display = 'none';
            document.getElementById('reader-view').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function goBack() {
            document.getElementById('reader-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            window.scrollTo(0, 0);
        }

        loadData();
    </script>
</body>
</html>
