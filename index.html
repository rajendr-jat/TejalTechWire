<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TejalTechWire — AI, EV & Gadget Wire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0A0C;
    --panel:#141417;
    --panel-2:#1B1B1F;
    --line:#2C2C32;
    --text:#F3F2EE;
    --text-dim:#9B9A97;
    --wire-amber:#D4AF37;
    --ai:#B3A6FF;
    --ev:#4FE0B3;
    --gadgets:#D4AF37;
    --live:#FF5D6C;
    --shadow:none;
  }
  [data-theme="light"]{
    --ink:#FFFFFF;
    --panel:#FFFFFF;
    --panel-2:#FAFAF8;
    --line:#EAE8E2;
    --text:#141414;
    --text-dim:#6B6A66;
    --wire-amber:#B8862F;
    --ai:#6C5CE0;
    --ev:#149E77;
    --gadgets:#B8862F;
    --shadow:0 2px 8px rgba(20,20,20,.04), 0 8px 24px rgba(20,20,20,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--ink); color:var(--text);
    font-family:'Source Serif 4', Georgia, serif;
    transition:background .3s, color .3s;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  .display{font-family:'Space Grotesk', sans-serif;}

  /* ---------- HEADER ---------- */
  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:1.1rem 5%; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--ink); z-index:50;
  }
  .logo{display:flex; align-items:center; gap:.6rem;}
  .logo-mark{
    width:34px; height:34px; border:2px solid var(--wire-amber); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono'; font-weight:600; color:var(--wire-amber); font-size:.75rem;
  }
  .logo-text{font-family:'Space Grotesk'; font-weight:700; font-size:1.35rem; letter-spacing:-.02em;}
  .logo-text span{color:var(--wire-amber);}
  nav{display:flex; gap:.4rem; align-items:center;}
  .pill{
    font-family:'IBM Plex Mono'; font-size:.75rem; letter-spacing:.04em; text-transform:uppercase;
    color:var(--text-dim); background:transparent; border:1px solid var(--line);
    padding:.45rem .9rem; border-radius:999px; cursor:pointer; transition:.2s;
  }
  .pill:hover, .pill.active{ color:var(--ink); background:var(--wire-amber); border-color:var(--wire-amber);}
  .theme-toggle{
    margin-left:.6rem; width:36px; height:36px; border-radius:50%; border:1px solid var(--line);
    background:transparent; color:var(--text); cursor:pointer; font-size:.9rem;
  }

  /* ---------- TICKER ---------- */
  .ticker-wrap{
    background:var(--panel-2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; overflow:hidden; height:38px;
  }
  .ticker-track{display:flex; white-space:nowrap; animation:scroll 45s linear infinite;}
  .ticker-track:hover{animation-play-state:paused;}
  .ticker-item{
    font-family:'IBM Plex Mono'; font-size:.78rem; color:var(--text-dim);
    padding:0 2rem; display:inline-flex; gap:.6rem; align-items:center;
  }
  .ticker-item b{color:var(--text); font-weight:500;}
  .ticker-item::after{content:"//"; color:var(--wire-amber); margin-left:2rem;}
  @keyframes scroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

  /* ---------- LAYOUT ---------- */
  .container{padding:2.5rem 5% 4rem;}
  .section-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:1.5rem;}
  .section-head h2{font-family:'Space Grotesk'; font-size:1.1rem; text-transform:uppercase; letter-spacing:.08em; margin:0; color:var(--text-dim);}
  .section-head .count{font-family:'IBM Plex Mono'; font-size:.75rem; color:var(--text-dim);}

  /* Featured */
  .featured{
    display:grid; grid-template-columns:1.1fr 1fr; gap:2rem;
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    overflow:hidden; margin-bottom:3rem; box-shadow:var(--shadow);
  }
  .featured img{width:100%; height:100%; object-fit:cover; min-height:280px;}
  .featured-body{padding:2rem 2rem 2rem 0; display:flex; flex-direction:column; justify-content:center;}
  .featured-body .cat-tag{margin-bottom:1rem;}
  .featured-body h1{font-family:'Space Grotesk'; font-size:1.9rem; line-height:1.15; margin:0 0 1rem;}
  .featured-text{color:var(--text-dim); font-size:.98rem; line-height:1.65; margin:0 0 1.3rem;
    max-height:260px; overflow-y:auto; padding-right:.5rem;}
  .featured-text p{margin:0 0 .9rem;}
  .featured-text p:last-child{margin-bottom:0;}

  /* List of horizontal dispatch rows */
  .grid{display:flex; flex-direction:column; gap:1rem;}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    display:flex; flex-direction:row; overflow:hidden; transition:transform .18s, border-color .18s, box-shadow .18s;
    border-left:3px solid var(--line); box-shadow:var(--shadow);
  }
  .card:hover{ transform:translateX(3px); border-left-color:var(--wire-amber); }
  .card img{
    width:150px; min-width:150px; height:100%; object-fit:cover; border-right:1px solid var(--line);
    align-self:stretch;
  }
  .card-body{padding:1rem 1.2rem; display:flex; flex-direction:column; flex:1; min-width:0;}
  .meta-row{display:flex; align-items:center; gap:.6rem; margin-bottom:.5rem;}
  .cat-tag{
    font-family:'IBM Plex Mono'; font-size:.66rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
    padding:.18rem .5rem; border-radius:3px; display:inline-block;
  }
  .cat-tag.ai{color:var(--ai); background:rgba(156,140,255,.12); border:1px solid rgba(156,140,255,.35);}
  .cat-tag.ev{color:var(--ev); background:rgba(51,214,166,.12); border:1px solid rgba(51,214,166,.35);}
  .cat-tag.gadgets{color:var(--gadgets); background:rgba(255,178,56,.12); border:1px solid rgba(255,178,56,.35);}
  .timestamp{font-family:'IBM Plex Mono'; font-size:.68rem; color:var(--text-dim);}
  .card h3{font-family:'Space Grotesk'; font-size:1rem; line-height:1.3; margin:0 0 .4rem;}
  .card p{color:var(--text-dim); font-size:.85rem; line-height:1.5; margin:0 0 .7rem;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card-footer{display:flex; justify-content:space-between; align-items:center; margin-top:auto;}
  .source-name{font-family:'IBM Plex Mono'; font-size:.7rem; color:var(--text-dim);}
  .read-link{font-family:'IBM Plex Mono'; font-size:.76rem; color:var(--wire-amber); text-decoration:none; font-weight:600; white-space:nowrap;}
  .read-link:hover{text-decoration:underline;}

  @media(max-width:600px){
    .card{flex-direction:row;}
    .card img{width:100px; min-width:100px;}
    .card h3{font-size:.92rem;}
    .card p{display:none;}
  }

  .empty-state{
    text-align:center; padding:4rem 1rem; color:var(--text-dim); font-family:'IBM Plex Mono'; font-size:.9rem;
  }

  footer{
    border-top:1px solid var(--line); padding:2.5rem 5%; text-align:center;
    font-family:'IBM Plex Mono'; font-size:.78rem; color:var(--text-dim);
  }
  footer .foot-brand{color:var(--wire-amber); font-weight:600;}
  footer a{color:var(--text-dim); margin:0 .6rem; text-decoration:none;}
  footer a:hover{color:var(--text);}

  @media(max-width:800px){
    .featured{grid-template-columns:1fr;}
    .featured img{min-height:200px;}
    .featured-body{padding:1.5rem;}
    nav{display:none;}
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">TW</div>
    <div class="logo-text">Tejal<span>Tech</span>Wire</div>
  </div>
  <nav id="nav-filters">
    <button class="pill active" onclick="filterNews('All', this)">All</button>
    <button class="pill" onclick="filterNews('AI & ML', this)">AI &amp; ML</button>
    <button class="pill" onclick="filterNews('EV', this)">EV</button>
    <button class="pill" onclick="filterNews('Gadgets', this)">Gadgets</button>
  </nav>
  <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">☾</button>
</header>

<div class="ticker-wrap">
  <div class="ticker-track" id="tickerTrack"></div>
</div>

<div class="container">
  <div id="featured-slot"></div>

  <div class="section-head">
    <h2>Latest Dispatches</h2>
    <span class="count" id="result-count"></span>
  </div>
  <div class="grid" id="news-container"></div>
</div>

<footer>
  <p><span class="foot-brand">TejalTechWire</span> — Independent AI, EV &amp; Gadget wire desk. &copy; 2026.</p>
  <p>Contact: rajulamror74@gmail.com</p>
  <p><a href="#">Privacy Policy</a>|<a href="#">Disclaimer</a>|<a href="#">About Us</a></p>
</footer>

<script>
  const themeBtn = document.getElementById('themeBtn');
  let currentTheme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);
  themeBtn.innerText = currentTheme === 'dark' ? '☀' : '☾';

  function toggleTheme(){
    currentTheme = currentTheme === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', currentTheme);
    localStorage.setItem('theme', currentTheme);
    themeBtn.innerText = currentTheme === 'dark' ? '☀' : '☾';
  }

  const CAT_CLASS = {'AI & ML':'ai', 'EV':'ev', 'Gadgets':'gadgets'};
  let allArticles = [];

  async function loadNews(){
    try{
      const res = await fetch('data/articles.json');
      allArticles = await res.json();
      if(!allArticles.length) throw new Error('empty');
      buildTicker(allArticles);
      renderNews(allArticles);
    }catch(err){
      document.getElementById('news-container').innerHTML =
        '<div class="empty-state">// WIRE SILENT — waiting for the next automated dispatch cycle...</div>';
    }
  }

  function timeAgo(iso){
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs/60000);
    if(mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins/60);
    if(hrs < 24) return hrs + 'h ago';
    return Math.floor(hrs/24) + 'd ago';
  }

  function buildTicker(articles){
    const items = articles.slice(0,10).map(a =>
      `<span class="ticker-item"><b>${escapeHtml(a.category)}</b> ${escapeHtml(a.title)}</span>`
    ).join('');
    document.getElementById('tickerTrack').innerHTML = items + items; // doubled for seamless loop
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.innerText = str || '';
    return d.innerHTML;
  }

  // Full article text ko proper paragraphs mein todta hai (featured story ke liye)
  function toParagraphs(str){
    return (str || '').split(/\n\s*\n/).map(p => `<p>${escapeHtml(p.trim())}</p>`).join('');
  }

  function renderNews(articles){
    const featuredSlot = document.getElementById('featured-slot');
    const container = document.getElementById('news-container');
    document.getElementById('result-count').innerText = articles.length + ' stories';

    if(!articles.length){
      featuredSlot.innerHTML = '';
      container.innerHTML = '<div class="empty-state">// No dispatches in this category yet.</div>';
      return;
    }

    const [top, ...rest] = articles;
    const topCatClass = CAT_CLASS[top.category] || 'gadgets';
    featuredSlot.innerHTML = `
      <div class="featured">
        <img src="${top.image_url || 'https://via.placeholder.com/700x400?text=TejalTechWire'}" alt="">
        <div class="featured-body">
          <span class="cat-tag ${topCatClass}">${escapeHtml(top.category)}</span>
          <h1>${escapeHtml(top.title)}</h1>
          <div class="featured-text">${toParagraphs(top.summary)}</div>
          <div class="card-footer" style="border:none; padding-top:0;">
            <span class="source-name mono">${escapeHtml(top.source_name)} · ${timeAgo(top.published_at)}</span>
            ${top.source_url && top.source_url !== '#' ? `<a class="read-link" href="${top.source_url}" target="_blank">Read Full Dispatch →</a>` : ''}
          </div>
        </div>
      </div>`;

    container.innerHTML = rest.map(a => {
      const cls = CAT_CLASS[a.category] || 'gadgets';
      return `
        <div class="card">
          <img src="${a.image_url || 'https://via.placeholder.com/400x200?text=TejalTechWire'}" alt="">
          <div class="card-body">
            <div class="meta-row">
              <span class="cat-tag ${cls}">${escapeHtml(a.category)}</span>
              <span class="timestamp">${timeAgo(a.published_at)}</span>
            </div>
            <h3>${escapeHtml(a.title)}</h3>
            <p>${escapeHtml(a.summary)}</p>
            <div class="card-footer">
              <span class="source-name">${escapeHtml(a.source_name)}</span>
              ${a.source_url && a.source_url !== '#' ? `<a class="read-link" href="${a.source_url}" target="_blank">Read →</a>` : '<span class="read-link" style="opacity:.4;">Original ✓</span>'}
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function filterNews(category, btn){
    document.querySelectorAll('#nav-filters .pill').forEach(p => p.classList.remove('active'));
    if(btn) btn.classList.add('active');
    if(category === 'All'){
      renderNews(allArticles);
    }else{
      renderNews(allArticles.filter(a => a.category === category));
    }
  }

  loadNews();
</script>
</body>
</html>
