<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TejalTechWire | Daily Tech & Innovation Briefs</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #202124;
            --card-bg: #ffffff;
            --primary: #1a73e8;
            --border-color: #dadce0;
            --secondary-text: #5f6368;
        }
        [data-theme="dark"] {
            --bg-color: #202124;
            --text-color: #e8eaed;
            --card-bg: #292a2d;
            --primary: #8ab4f8;
            --border-color: #3c4043;
            --secondary-text: #9aa0a6;
        }
        body {
            font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0; transition: background 0.3s, color 0.3s;
        }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.8rem 5%; background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 1000;
        }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { background: #f29900; color: white; font-weight: bold; padding: 6px 10px; border-radius: 6px; font-size: 1rem; }
        .logo { font-size: 1.3rem; font-weight: 500; color: var(--text-color); letter-spacing: -0.5px; }
        .logo span { font-weight: bold; color: var(--primary); }
        
        .nav-links { display: flex; gap: 8px; overflow-x: auto; padding: 5px 0; }
        .nav-links button {
            background: transparent; border: 1px solid var(--border-color); color: var(--text-color);
            padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: 0.2s;
        }
        .nav-links button:hover, .nav-links button.active {
            background: var(--primary); color: white; border-color: var(--primary);
        }
        
        .theme-toggle { cursor: pointer; padding: 6px 12px; background: transparent; border: 1px solid var(--border-color); color: var(--text-color); border-radius: 20px; font-size: 0.85rem; }
        
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .section-title { font-size: 1.1rem; font-weight: 500; margin-bottom: 1rem; color: var(--secondary-text); text-transform: uppercase; letter-spacing: 0.5px; }
        
        .grid { display: flex; flex-direction: column; gap: 1rem; }
        
        .card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 1.2rem; transition: box-shadow 0.2s; display: flex; flex-direction: column; gap: 8px;
        }
        .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        
        .card-meta { display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; color: var(--secondary-text); }
        .meta-left { display: flex; align-items: center; gap: 8px; }
        .badge { background: rgba(26, 115, 232, 0.1); color: var(--primary); padding: 2px 8px; border-radius: 4px; font-weight: 500; }
        
        .card h3 { margin: 4px 0; font-size: 1.15rem; font-weight: 500; line-height: 1.4; }
        .card h3 a { color: var(--text-color); text-decoration: none; }
        .card h3 a:hover { color: var(--primary); text-decoration: underline; }
        
        .card p { font-size: 0.92rem; color: var(--secondary-text); line-height: 1.5; margin: 0; }
        
        footer { text-align: center; padding: 2rem; color: var(--secondary-text); font-size: 0.85rem; border-top: 1px solid var(--border-color); margin-top: 3rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon">TW</div>
            <div class="logo">Tejal<span>TechWire</span></div>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark</button>
    </header>

    <div class="container">
        <!-- Category Filter Buttons -->
        <div class="nav-links" style="margin-bottom: 1.5rem;">
            <button class="active" onclick="filterNews('All', this)">Top Stories</button>
            <button onclick="filterNews('AI & ML', this)">AI & ML</button>
            <button onclick="filterNews('EV', this)">EV</button>
            <button onclick="filterNews('Gadgets', this)">Gadgets</button>
        </div>

        <div class="section-title">Latest Briefs</div>
        <div class="grid" id="news-container">
            <!-- Dynamic News Cards -->
        </div>
    </div>

    <footer>
        <p>&copy; 2026 TejalTechWire. Curated & Generated with AI.</p>
    </footer>

    <script>
        const themeBtn = document.querySelector('.theme-toggle');
        let currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        themeBtn.innerText = currentTheme === 'dark' ? '☀️ Light' : '🌙 Dark';

        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('theme', currentTheme);
            themeBtn.innerText = currentTheme === 'dark' ? '☀️ Light' : '🌙 Dark';
        }

        let allArticles = [];

        async function loadNews() {
            try {
                const response = await fetch('data/articles.json');
                allArticles = await response.json();
                renderNews(allArticles);
            } catch (error) {
                document.getElementById('news-container').innerHTML = "<p style='color:var(--secondary-text); text-align:center;'>Loading your briefs...</p>";
            }
        }

        function renderNews(articles) {
            const container = document.getElementById('news-container');
            container.innerHTML = '';
            
            if(articles.length === 0) {
                container.innerHTML = "<p style='color:var(--secondary-text); text-align:center;'>No stories available right now.</p>";
                return;
            }

            articles.forEach(article => {
                let linkTarget = article.source_url !== "#" ? `href="${article.source_url}" target="_blank"` : `href="#"`;
                
                const card = `
                    <div class="card">
                        <div class="card-meta">
                            <div class="meta-left">
                                <span class="badge">${article.category}</span>
                                <span>${article.source_name}</span>
                            </div>
                            <span>Just now</span>
                        </div>
                        <h3><a ${linkTarget}>${article.title}</a></h3>
                        <p>${article.summary}</p>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function filterNews(category, btn) {
            document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if(category === 'All') {
                renderNews(allArticles);
            } else {
                const filtered = allArticles.filter(a => a.category === category);
                renderNews(filtered);
            }
        }

        loadNews();
    </script>
</body>
</html>
